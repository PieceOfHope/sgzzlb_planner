<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>삼국지전략판 테크트리 체크리스트</title>
<style>
  :root{
    --bg:#14161C; --dark:#0E1015; --card:#1F232C; --card2:#272C37;
    --crimson:#B01B2E; --crimsonD:#2A1A1E; --gold:#D9A441; --goldD:#8A6A26;
    --txt:#F1EFEA; --muted:#9AA2AE; --line:#333947;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent}
  body{background:var(--bg); color:var(--txt);
    font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
    min-height:100vh; font-size:15px; line-height:1.5}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; font-size:inherit}
  input{font-family:inherit; font-size:15px; width:100%; background:var(--card2); color:var(--txt);
    border:1px solid var(--line); border-radius:10px; padding:12px 14px; outline:none}
  input:focus{border-color:var(--goldD)}
  .wrap{max-width:720px; margin:0 auto; padding:0 16px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:16px}
  .btn{display:block; width:100%; text-align:center; padding:13px; border-radius:10px; font-weight:700}
  .btn-main{background:var(--crimson); color:var(--txt); border:1px solid var(--gold)}
  .btn-sub{background:var(--card2); color:var(--gold); border:1px solid var(--goldD)}
  .btn:disabled{opacity:.55; cursor:default}
  .pill{font-size:12px; font-weight:700; padding:4px 10px; border-radius:999px; white-space:nowrap;
    background:var(--card2); color:var(--gold); border:1px solid var(--line)}
  .pill.now{background:var(--crimson); color:var(--txt); border-color:var(--gold)}
  .bar{width:100%; background:var(--card2); border-radius:999px; overflow:hidden; height:8px}
  .bar>i{display:block; height:100%; border-radius:999px; transition:width .4s;
    background:linear-gradient(90deg,var(--crimson),var(--gold))}
  .muted{color:var(--muted)} .gold{color:var(--gold)}
  .err{background:var(--crimsonD); color:#F0A0A8; border:1px solid var(--crimson);
    border-radius:10px; padding:9px 12px; font-size:13.5px; margin-bottom:12px}
  .hdr{position:sticky; top:0; z-index:10; background:var(--dark); border-bottom:1px solid var(--line); padding:14px 0 12px}
  label{display:block; font-size:13.5px; font-weight:700; color:var(--gold); margin:0 0 6px 2px}
  .chk{width:24px; height:24px; border-radius:7px; flex:none; margin-top:2px;
    background:var(--card2); border:1.5px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; color:transparent}
  .chk.on{background:var(--crimson); border-color:var(--gold); color:var(--txt)}
  .item{display:flex; gap:12px; align-items:flex-start; width:100%; text-align:left; padding:12px 16px; border-top:1px solid var(--line)}
  .item.on{background:rgba(217,164,65,.09); box-shadow:inset 3px 0 0 var(--gold)}
  .item.on .nm{color:var(--muted); text-decoration:line-through}
  .badge-done{background:var(--gold); color:#14161C; font-size:11px; font-weight:700;
    padding:3px 9px; border-radius:999px; white-space:nowrap}
  .sec-done{border-color:var(--gold)!important; background:linear-gradient(rgba(217,164,65,.05),rgba(217,164,65,.05)),var(--card)}
  .sec-h{display:flex; justify-content:space-between; align-items:center; width:100%;
    padding:14px 16px; text-align:left; gap:10px}
  .dot{width:12px; height:12px; border-radius:3px; background:var(--card2); border:1px solid var(--line)}
  .dot.on{background:var(--gold)}
  .mini{font-size:12px; padding:7px 12px; border-radius:8px; border:1px solid var(--line); color:var(--muted); font-weight:700}
  .fade{animation:f .25s ease} @keyframes f{from{opacity:0; transform:translateY(4px)} to{opacity:1}}
  .selchk{width:20px; height:20px; border-radius:50%; flex:none;
    background:var(--card2); border:1.5px solid var(--line);
    display:inline-flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:700; color:transparent}
  .selchk.on{background:var(--crimson); border-color:var(--gold); color:var(--txt)}
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:100;
    display:flex; align-items:center; justify-content:center; padding:20px}
  .modal{background:var(--card); border:1px solid var(--crimson); border-radius:16px;
    width:100%; max-width:380px; padding:24px; animation:f .2s ease}
</style>
</head>

 {id:"h1", tag:"호상 1차", title:"1번째 호상 때", items:[

   {id:"h1-2", name:"모든 조패", lv:"Lv.3"},

   {id:"h1-4", name:"본/분성 목·철", lv:"Lv.22~23", note:"가능하면 Lv.25까지"}]},
 {id:"h2", tag:"호상 2차", title:"2번째 호상 때", items:[
   {id:"h2-1", name:"본/분성 식량·목재·철", lv:"Lv.30"},

const ALL = SECTIONS.flatMap(s=>s.items);
const TOTAL = ALL.length;
const COSTS = ["17코 이하","18코","19코","20코"];

/* ── 상태 ── */
let me = null;              // {nick, key}
let checked = {};           // {itemId:1}
let openSec = null;
let saveTimer = null, saveState = "저장됨";
let adminUsers = {}, adminProg = {}, adminDetail = null;

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uKey = nick => encodeURIComponent(nick).replace(/\./g,"%2E");

/* ═══════════ 로그인 ═══════════ */
function renderLogin(msg){
  window.scrollTo(0,0);
  $("#app").innerHTML = `
  <div class="wrap fade" style="padding-top:52px; padding-bottom:40px; max-width:440px">
    <div style="text-align:center; margin-bottom:30px">
      <div style="width:80px;height:80px;border-radius:50%;background:var(--crimson);

      <h1 style="font-size:27px;margin-top:4px">테크트리 체크리스트</h1>
      <div class="muted" style="font-size:13px;margin-top:6px">아조씨 테크트리 Ver.02 · 총 ${TOTAL}단계</div>
    </div>
    <div class="card" style="padding:22px">
      <label>게임 닉네임</label>
      <input id="in-nick" placeholder="예) 붉은춘배" autocomplete="off">
      <div style="height:14px"></div>
      <label>계정번호</label>

      <div class="muted" style="font-size:12px;margin:6px 2px 16px">처음 입력하면 자동 등록됩니다. 다음부터는 같은 조합으로 접속하세요.</div>
      <div id="login-err">${msg?`<div class="err">${esc(msg)}</div>`:""}</div>
      <button class="btn btn-main" id="btn-login">내 테크트리 시작하기</button>
    </div>
    <div class="card" style="padding:14px; margin-top:14px; display:flex; gap:8px">
      <input id="in-admin" type="password" placeholder="관리자 코드" style="padding:9px 12px; font-size:14px">
      <button class="btn btn-sub" id="btn-admin" style="width:auto; white-space:nowrap; padding:9px 16px; font-size:13.5px">관리자 모드</button>
    </div>
  </div>`;
  $("#btn-login").onclick = login;
  $("#in-acct").onkeydown = e=>{ if(e.key==="Enter") login(); };
  $("#btn-admin").onclick = ()=>{
    if($("#in-admin").value.trim() !== ADMIN_CODE){
      $("#login-err").innerHTML = `<div class="err">관리자 코드가 올바르지 않습니다.</div>`; return;
    }
    renderAdmin(); loadAdmin();
  };
}

async function login(){
  const nick = $("#in-nick").value.trim(), acct = $("#in-acct").value.trim();
  if(!nick || !acct){ $("#login-err").innerHTML = `<div class="err">닉네임과 계정번호를 모두 입력해 주세요.</div>`; return; }
  const btn = $("#btn-login"); btn.disabled = true; btn.textContent = "불러오는 중...";
  try{
    const key = uKey(nick);
    const snap = await db.ref("users/"+key).get();
    const u = snap.val();
    if(u && u.acct !== acct){
      renderLogin("이미 등록된 닉네임인데 계정번호가 다릅니다. 처음 입력한 계정번호를 쓰세요."); return;
    }
    if(!u) await db.ref("users/"+key).set({nick, acct, ts: Date.now()});
    const p = (await db.ref("prog/"+key).get()).val();
    me = {nick, key};
    checked = (p && p.c) || {};
    myCost = (p && p.cost) || null;
    const first = SECTIONS.find(s=>s.items.some(i=>!checked[i.id]));
    openSec = first ? first.id : SECTIONS[0].id;
    renderTodo();
  }catch(e){
    console.error(e);
    renderLogin("서버 연결에 실패했습니다. 잠시 후 다시 시도해 주세요. ("+e.message+")");
  }
}

/* ═══════════ 개인 투두 ═══════════ */
let undoStack = [];
let myCost = null;

function scheduleSave(){
  saveState = "저장 중..."; updateHead();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{
      const done = Object.keys(checked).length;
      await db.ref("prog/"+me.key).set({c: checked, done, cost: myCost, ts: Date.now()});
      saveState = "저장됨";
    }catch(e){ saveState = "저장 실패 - 재시도하세요"; }
    updateHead();
  }, 600);
}
function updateHead(){
  const done = Object.keys(checked).length, pct = Math.round(done/TOTAL*100);
  const el = $("#head-sub"); if(el) el.textContent = `${done} / ${TOTAL} 완료 · ${saveState}`;
  const b = $("#head-bar"); if(b) b.style.width = pct+"%";
  const p = $("#head-pct"); if(p) p.textContent = pct+"%";
}

function nextCardHTML(){
  const next = ALL.find(i=>!checked[i.id]);
  if(!next) return `
    <div class="card" style="background:var(--crimsonD);border-color:var(--gold);padding:18px;
      text-align:center;font-weight:700;font-size:17px;color:var(--gold)">
      🎉 테크트리 전 단계 완료! 수고하셨습니다.</div>`;
  const nextSec = SECTIONS.find(s=>s.items.some(i=>i.id===next.id));
  return `
    <div class="card" style="background:var(--crimsonD);border-color:var(--crimson);padding:14px 16px;
      display:flex;gap:12px;align-items:center">
      <span style="background:var(--crimson);font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;flex:none">다음 할 일</span>
      <div style="min-width:0"><b class="gold">${esc(nextSec.tag)}</b>
        <span class="muted"> › </span><b>${esc(next.name)} ${esc(next.lv)}</b></div>
    </div>`;
}

function renderTodo(){

  $("#app").innerHTML = `

          display:flex;align-items:center;justify-content:center;flex:none">
          <span style="color:var(--gold);font-family:serif;font-weight:700">技</span></div>

          <div class="muted" id="head-sub" style="font-size:12px">${done} / ${TOTAL} 완료 · ${saveState}</div>

      </div>
      <div style="display:flex;gap:7px;flex:none">
        <button class="mini" id="btn-undo" style="color:var(--gold);border-color:var(--goldD);opacity:.4">↩ 되돌리기</button>
        <button class="mini" id="btn-out">나가기</button>
      </div>
    </div>
    <div style="display:flex;gap:10px;align-items:center">
      <div class="bar" style="flex:1"><i id="head-bar" style="width:${pct}%"></i></div>
      <b class="gold" id="head-pct" style="width:42px;text-align:right;font-size:14px">${pct}%</b>
    </div>
  </div></div>

  <div class="wrap fade" style="padding-top:16px; padding-bottom:60px">
    <div class="card" style="padding:13px 16px;margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:wrap">
        <b class="gold" style="font-size:14px">내 1군 코스트</b>
        <span class="muted" style="font-size:11.5px">언제든 수정 가능 · 관리자 현황에 표시됩니다</span>
      </div>
      <div id="cost-seg" style="display:grid;grid-template-columns:repeat(4,1fr);gap:7px"></div>
    </div>
    <div id="next-card" style="margin-bottom:14px">${nextCardHTML()}</div>
    <div id="secs"></div>
    <div class="muted" style="text-align:center;font-size:12px;margin-top:22px">
      체크는 자동 저장됩니다 · 실수로 체크했다면 ↩ 되돌리기 (PC는 Ctrl+Z)</div>
  </div>`;

  $("#btn-out").onclick = ()=>{ me=null; checked={}; undoStack=[]; myCost=null; renderLogin(); };
  $("#btn-undo").onclick = doUndo;
  renderCostSeg();
  renderSecs();
}

function renderCostSeg(){
  const el = $("#cost-seg"); if(!el) return;
  el.innerHTML = COSTS.map(c=>`

                   : "background:var(--card2);color:var(--muted);border:1px solid var(--line)"}">${c}</button>`).join("");
  el.querySelectorAll("[data-cost]").forEach(b=>b.onclick = ()=>{
    if(myCost === b.dataset.cost) return;
    myCost = b.dataset.cost;
    scheduleSave();
    renderCostSeg();
  });
}

/* 화면 유지한 채 필요한 부분만 갱신 (스크롤 위치 보존) */
function refreshTodoUI(){
  const nc = $("#next-card"); if(nc) nc.innerHTML = nextCardHTML();
  renderSecs();
  updateHead();
  const ub = $("#btn-undo"); if(ub) ub.style.opacity = undoStack.length ? "1" : ".4";
}

function renderSecs(){
  const next = ALL.find(i=>!checked[i.id]);
  $("#secs").innerHTML = SECTIONS.map(sec=>{
    const sd = sec.items.filter(i=>checked[i.id]).length, sa = sec.items.length;
    const open = openSec===sec.id, comp = sd===sa;
    const isNow = next && sec.items.some(i=>i.id===next.id);
    return `
    <div class="card ${comp?"sec-done":""}" style="margin-bottom:11px;overflow:hidden">
      <button class="sec-h" data-sec="${sec.id}">
        <span style="display:flex;gap:10px;align-items:center;min-width:0">
          <span class="pill ${isNow&&!comp?"now":""}">${esc(sec.tag)}</span>
          <b style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(sec.title)}</b></span>
        <span style="display:flex;gap:10px;align-items:center;flex:none">
          ${comp?`<span class="badge-done">✓ 완료</span>`
               :`<b style="font-size:12px;color:var(--muted)">${sd}/${sa}</b>`}
          <span class="muted">${open?"▲":"▼"}</span></span>
      </button>
      ${open ? sec.items.map(it=>{
        const on = !!checked[it.id];
        return `
        <button class="item ${on?"on":""}" data-item="${it.id}">
          <span style="min-width:0;flex:1">
            <span class="nm" style="font-weight:700">${esc(it.name)}</span>
            <b style="font-size:13.5px;color:${on?"var(--goldD)":"var(--gold)"}"> ${esc(it.lv)}</b>
            ${on?`<b style="font-size:11px;color:var(--gold);margin-left:6px">완료</b>`:""}
            ${it.note?`<div class="muted" style="font-size:12px;margin-top:2px">${esc(it.note)}</div>`:""}
          </span>
          <span class="chk ${on?"on":""}">✓</span>
        </button>`;
      }).join("") : ""}
    </div>`;
  }).join("");

  document.querySelectorAll("[data-sec]").forEach(b=>b.onclick = ()=>{
    openSec = openSec===b.dataset.sec ? null : b.dataset.sec; renderSecs();
  });
  document.querySelectorAll("[data-item]").forEach(b=>b.onclick = ()=>onToggle(b.dataset.item));
}

function onToggle(id){
  const was = !!checked[id];
  if(was) delete checked[id]; else checked[id]=1;
  undoStack.push({id, was});
  if(undoStack.length>100) undoStack.shift();
  scheduleSave();

  /* 체크 완료 시 → 다음 항목으로 이동 */
  let target = null, center = false;
  if(!was){
    const next = ALL.find(i=>!checked[i.id]);
    if(next){
      const nSec = SECTIONS.find(s=>s.items.some(i=>i.id===next.id));
      if(openSec !== nSec.id){ openSec = nSec.id; center = true; } // 챕터 완료 → 다음 챕터 자동 오픈
      target = next.id;
    }
  }
  refreshTodoUI();
  if(target){
    const el = document.querySelector(`[data-item="${target}"]`);
    if(el) el.scrollIntoView({behavior:"smooth", block: center ? "center" : "nearest"});
  }
}

function doUndo(){
  const last = undoStack.pop();
  if(!last) return;
  if(last.was) checked[last.id] = 1; else delete checked[last.id];
  scheduleSave();
  const sec = SECTIONS.find(s=>s.items.some(i=>i.id===last.id));
  if(openSec !== sec.id) openSec = sec.id;
  refreshTodoUI();
  const el = document.querySelector(`[data-item="${last.id}"]`);
  if(el) el.scrollIntoView({behavior:"smooth", block:"nearest"});
}

  }
});

/* 유저 행 데이터 계산 */
function admRows(){
  return Object.keys(adminUsers).map(k=>{
    const u = adminUsers[k];
    const c = (adminProg[k] && adminProg[k].c) || {};
    const done = Object.keys(c).length;
    const pct = Math.round(done/TOTAL*100);
    const next = ALL.find(i=>!c[i.id]);
    const nSec = next ? SECTIONS.find(s=>s.items.some(i=>i.id===next.id)) : null;
    const ts = (adminProg[k] && adminProg[k].ts) || u.ts || 0;
    const cost = (adminProg[k] && adminProg[k].cost) || null;
    return {k, u, c, done, pct, next, nSec, ts, cost};
  });
}
const DAY = 86400000;
function ago(ts){
  if(!ts) return "기록 없음";
  const d = Math.floor((Date.now()-ts)/DAY);
  if(d<=0) return "오늘"; if(d===1) return "어제"; return d+"일 전";
}

function admFiltered(){
  let rows = admRows();
  if(admQ) rows = rows.filter(r=>r.u.nick.toLowerCase().includes(admQ));
  if(admBand==="zero") rows = rows.filter(r=>r.done===0);
  else if(admBand==="fin") rows = rows.filter(r=>!r.next);
  else if(admBand==="idle") rows = rows.filter(r=>Date.now()-r.ts > 7*DAY);
  else if(admBand!=="all") rows = rows.filter(r=>r.nSec && r.nSec.id===admBand); // 챕터별: 현재 진행 중인 챕터 기준
  const by = {
    "pct-desc": (a,b)=>b.done-a.done || a.u.nick.localeCompare(b.u.nick,"ko"),
    "pct-asc":  (a,b)=>a.done-b.done || a.u.nick.localeCompare(b.u.nick,"ko"),
    "name":     (a,b)=>a.u.nick.localeCompare(b.u.nick,"ko"),
    "recent":   (a,b)=>b.ts-a.ts,
    "idle":     (a,b)=>a.ts-b.ts,
  };
  return rows.sort(by[admSort] || by["pct-desc"]);
}

/* ── 통계 상세 패널 ── */
function statsHTML(all){
  if(!all.length) return "";
  /* 진행률 분포 (10% 구간) */
  const buckets = Array(11).fill(0); // 0~9,10~19,...,90~99,100
  all.forEach(r=>{ buckets[r.pct===100 ? 10 : Math.floor(r.pct/10)]++; });
  const maxB = Math.max(...buckets, 1);
  const bLabel = i => i===10 ? "100%" : (i*10)+"~"+(i*10+9)+"%";

  /* 챕터별 평균 완료율 */
  const secAvg = SECTIONS.map(sec=>{
    const s = all.reduce((sum,r)=>sum + sec.items.filter(i=>r.c[i.id]).length/sec.items.length, 0);
    return {tag:sec.tag, pct:Math.round(s/all.length*100)};
  });

  /* 가장 많이 막혀있는 단계 (현재 '다음 할 일' 빈도 Top 5) */
  const stuck = {};
  all.forEach(r=>{ if(r.next) stuck[r.next.id] = (stuck[r.next.id]||0)+1; });
  const stuckTop = Object.entries(stuck).sort((a,b)=>b[1]-a[1]).slice(0,5)
    .map(([id,n])=>{ const it = ALL.find(i=>i.id===id);
      const sc = SECTIONS.find(s=>s.items.some(i=>i.id===id));
      return {label:`${sc.tag} · ${it.name} ${it.lv}`, n}; });
  const maxS = stuckTop.length ? stuckTop[0].n : 1;

  const row = (label, pct, right) => `
    <div style="display:flex;gap:10px;align-items:center;margin-bottom:6px;font-size:12.5px">
      <span style="width:130px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(label)}</span>
      <div class="bar" style="flex:1;height:7px"><i style="width:${pct}%"></i></div>
      <b class="gold" style="width:46px;text-align:right;font-size:12px">${right}</b>
    </div>`;

  /* 1군 코스트 분포 */
  const costCnt = {};
  all.forEach(r=>{ const c = r.cost || "미선택"; costCnt[c] = (costCnt[c]||0)+1; });
  const costRows = [...COSTS, "미선택"].filter(c=>costCnt[c]);

  return `
  <div class="card fade" style="padding:16px;margin-bottom:14px">
    <div style="display:grid;grid-template-columns:1fr;gap:18px">
      <div>
        <b class="gold" style="font-size:14px">1군 코스트 분포</b>
        <div style="margin-top:9px">
          ${costRows.map(c=>row(c, costCnt[c]/all.length*100, costCnt[c]+"명")).join("")}
        </div>
      </div>
      <div>
        <b class="gold" style="font-size:14px">진행률 분포</b>
        <div style="margin-top:9px">
          ${buckets.map((n,i)=>row(bLabel(i), n/maxB*100, n+"명")).join("")}
        </div>
      </div>
      <div>
        <b class="gold" style="font-size:14px">챕터별 평균 완료율</b>
        <div style="margin-top:9px">
          ${secAvg.map(s=>row(s.tag, s.pct, s.pct+"%")).join("")}
        </div>
      </div>
      ${stuckTop.length?`
      <div>
        <b class="gold" style="font-size:14px">지금 가장 많이 막혀 있는 단계 TOP ${stuckTop.length}</b>
        <div style="margin-top:9px">
          ${stuckTop.map(s=>row(s.label, s.n/maxS*100, s.n+"명")).join("")}
        </div>
      </div>`:""}
    </div>
  </div>`;
}

/* ── 선택 삭제 모드 ── */
function drawSelBar(){
  const el = $("#adm-selbar"); if(!el) return;
  if(!selMode){ el.innerHTML = ""; return; }
  const shown = admFiltered();
  const allSel = shown.length > 0 && shown.every(r=>selSet.has(r.k));
  el.innerHTML = `
  <div class="card" style="padding:11px 14px;margin-bottom:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-color:var(--crimson)">
    <b style="font-size:13.5px;color:#F0A0A8">선택 삭제 모드</b>
    <span class="muted" style="font-size:12.5px;flex:1;min-width:120px">${selSet.size}명 선택됨 · 행을 눌러 선택하세요</span>
    <button class="mini" id="sel-all" style="color:var(--gold);border-color:var(--goldD)">${allSel?"전체 해제":"표시된 전체 선택"}</button>
    <button class="mini" id="sel-del" style="color:#F0A0A8;border-color:var(--crimson)">선택한 ${selSet.size}명 삭제</button>
    <button class="mini" id="sel-exit">취소</button>
  </div>`;
  $("#sel-all").onclick = ()=>{
    if(allSel) shown.forEach(r=>selSet.delete(r.k));
    else shown.forEach(r=>selSet.add(r.k));
    drawAdmin();
  };
  $("#sel-del").onclick = ()=>{
    if(!selSet.size){ alert("선택된 맹원이 없습니다. 행을 눌러 먼저 선택해 주세요."); return; }
    const names = [...selSet].slice(0,3).map(k=>adminUsers[k] ? adminUsers[k].nick : "").filter(Boolean).join(", ");
    confirmModal({
      title: "선택 맹원 삭제",
      msg: `선택한 <b style="color:var(--gold)">${selSet.size}명</b> (${esc(names)}${selSet.size>3?" 외":""})의<br>맹원 정보와 진행 기록을 삭제합니다.<br>되돌릴 수 없습니다.`,
      okLabel: "삭제",
      onOk: async ()=>{
        const upd = {};
        [...selSet].forEach(k=>{ upd["users/"+k] = null; upd["prog/"+k] = null; });
        await db.ref().update(upd);
        [...selSet].forEach(k=>{ delete adminUsers[k]; delete adminProg[k]; });
        selSet.clear(); selMode = false; adminDetail = null;
        drawAdmin();
        const sm = $("#btn-selmode"); if(sm) sm.textContent = "선택 삭제";
      }
    });
  };
  $("#sel-exit").onclick = ()=>{
    selMode = false; selSet.clear(); drawAdmin();
    const sm = $("#btn-selmode"); if(sm) sm.textContent = "선택 삭제";
  };
}

/* ── 공용 확인 모달 ── */
function confirmModal({icon="⚠️", title, msg, okLabel, onOk}){
  const ov = document.createElement("div");
  ov.className = "overlay";
  ov.innerHTML = `
    <div class="modal">
      <div style="font-size:34px;text-align:center;margin-bottom:10px">${icon}</div>
      <div style="font-weight:700;font-size:17px;text-align:center;margin-bottom:8px">${title}</div>
      <div class="muted" style="font-size:14px;text-align:center;line-height:1.6;margin-bottom:20px">${msg}</div>
      <div style="display:flex;gap:10px">
        <button class="btn" id="cm-cancel" style="background:var(--card2);color:var(--txt);border:1px solid var(--line)">취소</button>
        <button class="btn" id="cm-ok" style="background:var(--crimson);color:var(--txt);border:1px solid var(--gold)">${okLabel}</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  ov.onclick = e=>{ if(e.target===ov) ov.remove(); };
  ov.querySelector("#cm-cancel").onclick = ()=>ov.remove();
  ov.querySelector("#cm-ok").onclick = async ()=>{
    const ok = ov.querySelector("#cm-ok");
    ok.disabled = true; ok.textContent = "처리 중...";
    try{ await onOk(); ov.remove(); }
    catch(e){ ok.disabled = false; ok.textContent = okLabel; alert("실패했습니다: " + e.message); }
  };
}

/* ── 진행상황 전체 초기화 ── */
function showResetModal(){
  const ov = document.createElement("div");
  ov.className = "overlay";
  ov.innerHTML = `
    <div class="modal">
      <div style="font-size:34px;text-align:center;margin-bottom:10px">⚠️</div>
      <div style="font-weight:700;font-size:17px;text-align:center;margin-bottom:8px">진행상황 초기화</div>
      <div class="muted" style="font-size:14px;text-align:center;line-height:1.6;margin-bottom:20px">
        모든 맹원들의 진행 상태를 지웁니다.<br><b style="color:var(--gold)">백업하셨습니까?</b><br>
        <span style="font-size:12px">(맹원 명단은 유지되고, 체크 기록만 삭제됩니다)</span>
      </div>
      <div style="display:flex;gap:10px">
        <button class="btn" id="rs-cancel" style="background:var(--card2);color:var(--txt);border:1px solid var(--line)">취소</button>
        <button class="btn" id="rs-ok" style="background:var(--crimson);color:var(--txt);border:1px solid var(--gold)">초기화</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  ov.onclick = e=>{ if(e.target===ov) ov.remove(); };
  ov.querySelector("#rs-cancel").onclick = ()=>ov.remove();
  ov.querySelector("#rs-ok").onclick = async ()=>{
    const ok = ov.querySelector("#rs-ok");
    ok.disabled = true; ok.textContent = "초기화 중...";
    try{
      await db.ref("prog").remove();
      adminProg = {}; adminDetail = null;
      ov.remove();
      drawAdmin();
    }catch(e){
      ok.disabled = false; ok.textContent = "초기화";
      alert("초기화에 실패했습니다: " + e.message);
    }
  };
}

/* ── 내보내기 ── */
function exportJSON(){
  const blob = new Blob([JSON.stringify({exportedAt:new Date().toISOString(), users:adminUsers, prog:adminProg}, null, 2)],
    {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "테크트리_백업_" + new Date().toISOString().slice(0,10) + ".json";
  a.click();
}
function exportCSV(){
  const rows = admFiltered(); // 현재 검색/필터가 그대로 적용된 목록을 추출
  const head = ["닉네임","계정번호","1군코스트","진행률(%)","완료단계","전체단계","현재챕터","다음할일","마지막체크"];
  const lines = rows.map(r=>[
    r.u.nick, r.u.acct, r.cost||"미선택", r.pct, r.done, TOTAL,
    r.next ? r.nSec.tag : "전체완료",
    r.next ? `${r.next.name} ${r.next.lv}` : "-",
    r.ts ? new Date(r.ts).toLocaleString("ko-KR") : "-"
  ].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(","));
  const csv = "\uFEFF" + head.join(",") + "\n" + lines.join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv;charset=utf-8"}));
  a.download = "테크트리_현황_" + new Date().toISOString().slice(0,10) + ".csv";
  a.click();
}

/* 시작 */
renderLogin();
</script>
